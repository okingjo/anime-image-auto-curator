# 角色 + 服装定义。复制为 config/characters.yaml 后修改。
#
# 每个角色：
#   id            内部标识（英文）
#   name_tags     出现在 prompt 里的角色名 tag（命中其一即认定是该角色）
#   lora_patterns 角色 LoRA 名的子串（命中其一也算）
#   outfits       多套服装/皮肤，每套含 name + tags；一套可标 default: true
#
# tags 用 prompt 里的原始写法即可（小写、不区分大小写匹配，会自动去转义/去权重）。

characters:
  - id: velina
    name_tags: ["velina airgid"]
    lora_patterns: ["Char-ZZZ-Velina"]
    outfits:
      - name: default
        default: true
        tags:
          - low twintails
          - headscarf
          - white hair bow
          - ginkgo earrings
          - high collar
          - yellow ascot
          - blue sideless dress
          - shoulder cutout
          - studded belt
          - high-low dress
          - finger cots
          - white striped thighhighs
          - white platform heels
      # 例：第二套官方皮肤（按你的角色实际填）
      # - name: swimsuit
      #   tags: [swimsuit, ...]
