# 打分配置。复制为 config/curator.yaml 后修改。
#
# weights: 各打分项权重。未安装/不可用的打分项会自动忽略并在已启用项间归一化。
#   quality          轻量质检（空白/退化图检测）。动漫图很少糊/过曝，故权重低。
#   aesthetic        美观度（兼作结构合理性参考）。模型可切换，见 aesthetic_model。
#   vlm_judge        本地 VLM → 手部/肢体/服装结构判定（Phase 3）。
#
# aesthetic_model: 选哪个美观度模型（可选值见 README）。
#   improved-clip          当前默认，CLIP ViT-L/14 + improved-aesthetic-predictor（照片/AI图训练，动漫一般）
#   aesthetic-predictor-v2-5  SigLIP，明确支持插画，社区最流行
#   skytnt-anime           ONNX，danbooru 训练，动漫专用、轻快
#   aesthetic-shadow-v2    1.1B ViT，动漫专用、质量高、较重
#
# characters_file: 角色配置文件路径（相对项目根）。

characters_file: config/characters.yaml
recursive: true
thumbs_size: 512
aesthetic_model: shadow-v2

weights:
  quality: 0.8
  aesthetic: 0.2
  structure: 0.05          # 2026-10 校准转正（影子模式毕业，见 docs/CALIBRATION_2026-10.md）
  vlm_judge: 0.0

# 质检 flag（偏糊/过曝/纯色）额外惩罚：带 flag 的成员综合分直接减去该值。
# 2026-10 校准：用户几乎不选带质检 flag 的图（被选率 1.5% vs 未选 1.7% vs
# 整组弃选 5.2%），原始扣分量不足以把它压下去，需要额外硬性降权。
quality_flag_penalty: 0.25

# 组级“疑似整组弃选”提示（仅 UI 提示，不影响排序/选择）。
# 2026-10 校准：组平均 sharpness < 0.45 可捕获 65% 的整组弃选，
# 误报率 23%（基线 16%，2.2x lift）。设 0 关闭。
suspect:
  mean_sharpness_below: 0.45

# ---------------------------------------------------------------------------
# 结构打分：DWPose 骨架/手部几何 + 可选 YOLO 部位检测板块。
# 2026-10 已依据 ~9k 条反馈转正（shadow:false + weights.structure=0.05），
# 依据与统计见 docs/CALIBRATION_2026-10.md。shadow:true 可退回纯影子模式。
#
# parts：body/hands/yolo 三个子分的内部权重（仅对“可见”部分归一化）。
# pose ：DWPose 配置。det_conf=人体检测阈值；hand_vis=手部关键点可见阈值；
#        hand_min_palm=手掌尺寸小于人物框高度此比例时视为“太小不可判”（N/A）。
# yolo ：部位检测板块。最多 4 个模型，每个模型一个部位，板块分 = 各模型分的平均。
#        source 可为本地 .pt/.onnx 路径，或 "repo_id:filename"（自动从 hf-mirror 下载）。
#        vis_floor=低于此置信度视为“未检出”（该部位 N/A，不扣分）；top_k=取最高 k 个。
#        例：手/脚/脸各一个模型（需先 uv sync --extra yolo）。
# ---------------------------------------------------------------------------
structure:
  shadow: false
  parts:
    body: 0.30
    hands: 0.30
    feet: 0.15             # v2 新增：脚趾/脚跟几何（仅重度畸形扣分）
    yolo: 0.25
  pose:
    enabled: true
    det_conf: 0.30
    max_persons: 3
    body_vis: 0.35
    hand_vis: 0.40
    hand_min_palm: 0.035
    foot_vis: 0.40         # 脚部关键点可见阈值（低于则 N/A 不扣分）
    detector: anime        # 人体检测器：anime(动漫域 v1.1_m) | humanart | coco
    ab_shadow: humanart    # A/B 影子检测器：逐图记录分歧，不影响分数；设 "" 关闭
  yolo:
    vis_floor: 0.35
    top_k: 4
    models:
      - {id: hand, label: 手, source: ".models/onnx/hand_yolov9c.onnx"}
      - {id: face, label: 脸, source: ".models/onnx/face_yolov8n_v2.onnx"}
    # ONNX 模型走 DirectML GPU；.pt 也可（自动导出 ONNX）。
    # source 可为本地路径或 "repo_id:filename"（自动从 hf-mirror 下载）。

# ---------------------------------------------------------------------------
# 角色还原（CCIP 图像侧身份特征）。三层：参考图/变体比对、组内质心离群、
# VLM 语义清单。换装/换发型：在 characters.yaml 配 variants + reference_images；
# 无参考图时用“组内首张高置信图”动态锚定。shadow:true 先收集数据再转正。
# ---------------------------------------------------------------------------
character_ccip:
  enabled: true
  shadow: true
  model: ccip-caformer_b36-24
  threshold: 0.213         # 官方同角色阈值（metrics.json 可覆盖）
  hair_relax: 1.4          # 换发型变体阈值放宽倍数
  outfit_relax: 1.15       # prompt 服装重合度低时再放宽
  group_outlier: 0.16      # 组内离群：高于组中位数此值 → flag
  dynamic_anchor: true
  cache: true

# ---------------------------------------------------------------------------
# 本地 VLM 判定（解剖合理性 + 角色清单）。运行时为便携 llama.cpp llama-server，
# 二进制与 GGUF 全在 .models/ 内，零安装、随仓库脚本分发：
#   python scripts/setup_models.py --only vlm
# 级联门控：只在结构分低/有畸形 flag/需要角色清单时调用，省算力。
# 已有 OpenAI 兼容端点可设 base_url 复用（此时不启动自带服务）。
# ---------------------------------------------------------------------------
vlm_judge:
  enabled: false           # 权重下载完成后改 true
  base_url: ""             # 例 http://127.0.0.1:11434/v1（Ollama）；留空用自带服务
  mode: cascade            # cascade | all | off
  gate: 0.85               # 结构分低于此值 → 可疑，触发 VLM
  max_images: 400          # 每次扫描 VLM 调用预算
  max_crops: 3             # 每图细节裁剪数（手优先，其次足/脸）
  ctx: 8192
  parallel: 2
  timeout_s: 120
  max_tokens: 300
  cache: true
