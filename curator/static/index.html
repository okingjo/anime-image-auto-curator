<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Anime Image Curator</title>
<style>
  :root{--bg:#12141a;--card:#1b1f28;--card2:#232836;--line:#2c3242;--txt:#e6e9ef;--mut:#9aa3b2;
        --acc:#5b8cff;--gold:#ffcf5b;--bad:#ff6b6b;--ok:#4cd07d;}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 system-ui,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--txt)}
  header{position:sticky;top:0;z-index:10;background:#0e1015ee;backdrop-filter:blur(6px);
         border-bottom:1px solid var(--line);padding:10px 16px}
  h1{font-size:16px;margin:0 0 8px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input,button,select{background:var(--card2);color:var(--txt);border:1px solid var(--line);
        border-radius:8px;padding:7px 10px;font-size:13px}
  input[type=text]{min-width:340px}
  button{cursor:pointer}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
  button:hover{filter:brightness(1.1)}
  .mut{color:var(--mut);font-size:12px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .chip{font-size:11px;padding:3px 8px;border-radius:20px;border:1px solid var(--line);background:var(--card)}
  .chip.on{color:var(--ok);border-color:#2c5c40}
  .chip.off{color:var(--mut)}
  main{padding:16px;max-width:1500px;margin:0 auto}
  .group{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:18px;overflow:hidden}
  .ghead{padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card2)}
  .ghead .pos{font-size:12px;color:var(--mut);word-break:break-all;max-height:3.2em;overflow:hidden}
  .ghead .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin-top:4px}
  .tag{background:#2a3145;padding:2px 7px;border-radius:6px;color:#c7d2fe}
  .tag.suspect{background:#4a2c1a;color:#fbbf77;border:1px solid #7a4a22;cursor:help}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:12px}
  .icard{background:var(--card2);border:2px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;
         position:relative;transition:.12s}
  .icard:hover{border-color:var(--acc)}
  .icard.sel{border-color:var(--gold);box-shadow:0 0 0 2px #ffcf5b44}
  .icard img{width:100%;display:block;aspect-ratio:2/3;object-fit:cover;background:#000}
  .badge{position:absolute;top:6px;right:6px;background:#000b;color:#fff;font-size:12px;font-weight:600;
         padding:2px 7px;border-radius:6px}
  .rec{position:absolute;top:6px;left:6px;background:var(--gold);color:#222;font-size:11px;font-weight:700;
       padding:2px 7px;border-radius:6px}
  .ibody{padding:8px 9px}
  .subs{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
  .sub{font-size:10.5px;color:var(--mut);background:#1a1e29;padding:2px 6px;border-radius:5px}
  .flags{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px}
  .flag{font-size:10.5px;color:var(--bad);background:#3a2028;padding:2px 6px;border-radius:5px}
  .fname{font-size:11px;color:var(--mut);word-break:break-all}
  .bar{height:5px;border-radius:3px;background:#2a3145;margin-top:6px;overflow:hidden}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--ok))}
  .empty{padding:40px;text-align:center;color:var(--mut)}
  .icard.blank{border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;
         min-height:200px;background:transparent;flex-direction:column;gap:8px}
  .icard.blank:hover{border-color:var(--bad)}
  .icard.blank.sel{border-color:var(--bad);box-shadow:0 0 0 2px #ff6b6b44}
  .icard.blank .blank-icon{font-size:36px;opacity:.4}
  .icard.blank .blank-text{font-size:13px;color:var(--mut)}
  .lightbox{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:50;flex-direction:column}
  .lightbox.on{display:flex}
  .lightbox img{max-width:92vw;max-height:82vh;border-radius:8px;user-select:none}
  .lightbox .cap{color:#ccc;font-size:12px;margin-top:10px;max-width:90vw;text-align:center}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:#0008;color:#fff;border:1px solid #fff3;
         border-radius:50%;width:48px;height:48px;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;
         transition:.15s;user-select:none}
  .lb-nav:hover{background:#000c;border-color:#fff6}
  .lb-nav.prev{left:20px}
  .lb-nav.next{right:20px}
  .lb-actions{display:flex;gap:10px;margin-top:12px}
  .lb-actions button{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:8px 20px;font-size:14px;cursor:pointer}
  .lb-actions button:hover{filter:brightness(1.15)}
  .lb-actions .lb-counter{color:#999;font-size:13px;display:flex;align-items:center}
  .sub.st-shadow{color:#b794f6;background:#241a33;border:1px dashed #4a3a6a}
  .vis{display:inline-block;font-size:9.5px;padding:1px 4px;border-radius:4px;margin-left:2px}
  .vis.y{color:var(--ok);background:#16301f}
  .vis.n{color:var(--mut);background:#1a1e29}
  /* ---- live scan progress ---- */
  .scanprog{margin-top:8px;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px}
  .scanprog[hidden]{display:none}
  .sp-top{display:flex;align-items:center;gap:10px;font-size:12px}
  .sp-phase{display:flex;align-items:center;gap:6px;font-weight:600}
  .sp-dot{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:sppulse 1s ease-in-out infinite}
  .scanprog.done .sp-dot{background:var(--ok);animation:none}
  .scanprog.error .sp-dot{background:var(--bad);animation:none}
  .sp-count{color:var(--mut);font-variant-numeric:tabular-nums}
  .sp-pct{margin-left:auto;color:var(--acc);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
  .scanprog.done .sp-pct{color:var(--ok)}
  .scanprog.error .sp-pct{color:var(--bad)}
  .sp-eta{color:var(--mut);font-variant-numeric:tabular-nums;min-width:120px;text-align:right}
  .sp-track{height:8px;border-radius:4px;background:#2a3145;margin:6px 0 4px;overflow:hidden}
  .sp-fill{height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--acc),var(--ok));
        position:relative;overflow:hidden;transition:width .35s ease}
  .sp-fill::after{content:"";position:absolute;inset:0;
        background:linear-gradient(90deg,transparent,#ffffff33,transparent);
        transform:translateX(-100%);animation:spshimmer 1.4s linear infinite}
  .scanprog.done .sp-fill::after,.scanprog.error .sp-fill::after{animation:none;opacity:0}
  .sp-fill.indet{width:100%!important;
        background:repeating-linear-gradient(45deg,var(--acc) 0 12px,#3d5a99 12px 24px);
        background-size:34px 100%;animation:spstripes .8s linear infinite}
  .sp-fill.indet::after{animation:none;opacity:0}
  .scanprog.error .sp-fill{background:var(--bad)}
  .sp-file{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @keyframes sppulse{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes spshimmer{to{transform:translateX(100%)}}
  @keyframes spstripes{to{background-position:34px 0}}
  @media (prefers-reduced-motion:reduce){
    .sp-dot,.sp-fill::after,.sp-fill.indet{animation:none}
    .sp-fill{transition:none}
  }
  .err{color:var(--bad);font-size:12px;margin-top:6px}
  /* in-page toast: alert() is silently blocked once the click's transient
     activation expires (~5s) — large copies exceed that. Toast never blocks. */
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:100;
         background:var(--card2);border:1px solid var(--line);border-left:4px solid var(--ok);
         color:var(--txt);padding:12px 18px;border-radius:10px;font-size:13px;max-width:80vw;
         box-shadow:0 6px 24px #000a;opacity:0;pointer-events:none;transition:opacity .25s;
         white-space:pre-line}
  .toast.on{opacity:1}
  .toast.bad{border-left-color:var(--bad)}
  .grow{flex:1}
</style>
</head>
<body>
<header>
  <h1><span data-i18n="app_title">🖼️ Anime Image Curator · 动漫图筛</span> <span class="mut" id="rootinfo"></span></h1>
  <div class="row">
    <input id="folder" type="text" data-i18n-ph="folder_ph" placeholder="图片文件夹绝对路径，例如 D:\imgs\velina"/>
    <label class="mut"><input id="recursive" type="checkbox" checked style="min-width:auto"/> <span data-i18n="recursive">含子目录</span></label>
    <button class="primary" id="scanbtn" onclick="doScan()" data-i18n="scan">扫描 Scan</button>
    <span class="grow"></span>
    <button onclick="exportJSON()" data-i18n="export_json">导出精选(JSON)</button>
    <input id="dest" type="text" data-i18n-ph="dest_ph" placeholder="拷贝精选到目录(可选)" style="min-width:220px"/>
    <button onclick="exportCopy()" data-i18n="copy_selected">拷贝精选</button>
    <label class="mut" data-i18n-title="record_title" title="把本次的选择结果+全部打分特征记录到 data/feedback/，用于以后校准结构打分权重">
      <input id="record" type="checkbox" style="min-width:auto"/> <span data-i18n="record">记录本次导出</span></label>
    <button id="langbtn" onclick="toggleLang()" title="Switch language / 切换语言">EN</button>
  </div>
  <div class="row" style="margin-top:8px">
    <span class="mut" data-i18n="ae_model">美观度模型:</span>
    <select id="aemodel" onchange="onAeChange()" style="min-width:260px"></select>
    <span class="mut" id="aedesc"></span>
  </div>
  <div class="chips" id="chips"></div>
  <div class="row" style="margin-top:6px">
    <label class="mut" style="cursor:pointer"><input id="filterflags" type="checkbox"
      style="min-width:auto" onchange="render()"/> <span data-i18n="only_flagged">只看有结构问题的组</span></label>
    <span class="mut" id="shadowhint"></span>
  </div>
  <div class="scanprog" id="scanprog" hidden>
    <div class="sp-top">
      <span class="sp-phase"><span class="sp-dot"></span><span id="spphase" data-i18n="preparing">准备中</span></span>
      <span class="sp-count" id="spcount"></span>
      <span class="sp-pct" id="sppct"></span>
      <span class="sp-eta" id="speta"></span>
    </div>
    <div class="sp-track"><div class="sp-fill" id="spfill"></div></div>
    <div class="sp-file" id="spfile"></div>
  </div>
  <div class="err" id="err"></div>
</header>
<main>
  <div class="empty" id="empty"><span data-i18n="empty_hint">输入图片文件夹路径并点击「扫描」。同一段 prompt 的图会自动归为一组，每组推荐综合分最高的一张。</span></div>
  <div id="groups"></div>
</main>

<div class="lightbox" id="lb" onclick="lbBackdropClick(event)">
  <button class="lb-nav prev" onclick="lbNav(-1);event.stopPropagation()" data-i18n-title="lb_prev" title="上一张 (←)">◀</button>
  <img id="lbimg"/><div class="cap" id="lbcap"></div>
  <div class="lb-actions">
    <button onclick="lbSelect();event.stopPropagation()" data-i18n="lb_select">✔ 选择它 (Enter)</button>
    <button id="lbov" onclick="lbToggleOverlay();event.stopPropagation()" data-i18n="lb_skeleton" style="background:var(--card2);border:1px solid var(--line)">☸ 骨架 (O)</button>
    <span class="lb-counter" id="lbcounter"></span>
  </div>
  <button class="lb-nav next" onclick="lbNav(1);event.stopPropagation()" data-i18n-title="lb_next" title="下一张 (→)">▶</button>
</div>

<div class="toast" id="toast"></div>
<script>
let STATE=null;
const $=id=>document.getElementById(id);

/* ---- i18n (zh/en) ---- */
const I18N={

},

}};
let LANG=(()=>{try{const s=localStorage.getItem("curator_lang");if(s==="zh"||s==="en")return s;}catch(e){}
  return /^zh/i.test(navigator.language||"")?"zh":"en";})();
function t(key,params){let s=(I18N[LANG]&&I18N[LANG][key])!=null?I18N[LANG][key]:key;
  if(params)for(const k in params)s=s.split("{"+k+"}").join(String(params[k]));return s;}
function applyLang(){
  document.documentElement.lang=(LANG==="zh"?"zh-CN":"en");
  document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=t(el.dataset.i18n);});
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{el.placeholder=t(el.dataset.i18nPh);});
  document.querySelectorAll("[data-i18n-title]").forEach(el=>{el.title=t(el.dataset.i18nTitle);});
  const lb=$("langbtn");if(lb)lb.textContent=LANG==="zh"?"EN":"中文";
  if($("scanbtn").disabled)$("scanbtn").textContent=t("scanning");
  SCORE_LABEL={quality:t("score_quality"),aesthetic:t("score_aesthetic"),tagger_fidelity:t("score_fidelity"),character_ccip:t("score_fidelity"),vlm_judge:t("score_vlm"),structure:t("score_structure")};
  PART_LABEL={hand_l:t("part_hand_l"),hand_r:t("part_hand_r"),person:t("part_person"),feet:t("part_feet")};
  PHASE_LABEL={listing:t("ph_listing"),scoring:t("ph_scoring"),grouping:t("ph_grouping"),saving:t("ph_saving"),done:t("ph_done"),error:t("ph_error"),idle:t("ph_idle")};
}
function toggleLang(){LANG=LANG==="zh"?"en":"zh";
  try{localStorage.setItem("curator_lang",LANG);}catch(e){}
  applyLang();loadStatus();if(STATE)render();
  if(!$("scanprog").hidden)pollProg();
  if($("lb").classList.contains("on"))_lbRender();}
/* English overrides for backend-provided aesthetic model texts (zh keeps backend values).
   Keys are the real backend ids from aesthetic_backends.py. */
const AE_I18N={
 "improved-clip":{domain:"general (photo/AI)",desc:"CLIP+MLP baseline trained on photos; weak on anime."},
 "shadow-v2":{domain:"anime",desc:"1.1B ViT, 1024×1024, danbooru-trained. Strongest community anime aesthetic model (mirror of a delisted original)."},
 "skytnt-anime":{domain:"anime",desc:"ConvNeXtV2 ONNX, danbooru-trained. Fast on CPU/GPU, good for large batches."},
 "aesthetic-predictor-v2-5":{domain:"general + illustration",desc:"SigLIP with explicit illustration support; best-maintained community ecosystem."}
};
function aeDesc(b){return (LANG==="en"&&AE_I18N[b.id])?AE_I18N[b.id].desc:b.desc;}
let toastTimer=null;
function toast(msg,bad){const el=$("toast");if(!el)return;
  el.textContent=msg;el.classList.toggle("bad",!!bad);el.classList.add("on");
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove("on"),bad?9000:5000);}

let SCORE_LABEL={quality:t("score_quality"),aesthetic:t("score_aesthetic"),tagger_fidelity:t("score_fidelity"),character_ccip:t("score_fidelity"),vlm_judge:t("score_vlm"),structure:t("score_structure")};
let PART_LABEL={hand_l:t("part_hand_l"),hand_r:t("part_hand_r"),person:t("part_person"),feet:t("part_feet")};

async function loadStatus(){
  let s;
  try{
    const r=await fetch("/api/status");
    if(!r.ok) throw new Error("HTTP "+r.status);
    s=await r.json();
    if(!s||!Array.isArray(s.scorers)) throw new Error(t("no_scorers"));
  }catch(e){
    $("err").textContent=t("status_fail",{e:String(e.message||e)});
    return;
  }
  if(s.root) $("rootinfo").textContent="· "+s.root;
  const chips=s.scorers.map(x=>{
    const st=x.available?t("chip_on"):t("chip_off");
    const title=x.available?"":(x.reason||"");
    return `<span class="chip ${x.available?'on':'off'}" title="${title}">${(LANG==="en"&&SCORE_LABEL[x.name])?SCORE_LABEL[x.name]:x.label} · ${st}</span>`;
  }).join("");
  const st=s.scorers.find(x=>x.name==="structure");
  if(st&&st.available){
    $("shadowhint").textContent=st.shadow?t("shadow_hint"):t("structure_active");
  }
  const hint=s.scorers.some(x=>!x.available)?
    ` <span class="mut">${t("extras_hint")}</span>`:"";
  $("chips").innerHTML=chips+hint;
  renderAeSelect(s.aesthetic_backends||[]);
}

function renderAeSelect(backends){
  const sel=$("aemodel"); if(!sel) return;
  sel.innerHTML=backends.map(b=>{
    const dis=b.available?"":"disabled";
    const tag=b.available?(LANG==="en"&&AE_I18N[b.id]?AE_I18N[b.id].domain:b.domain):t("not_installed");
    return `<option value="${b.id}" ${b.active?'selected':''} ${dis}>${b.label} · ${tag} · ${b.approx_size}</option>`;
  }).join("");
  updateAeDesc(backends);
  sel._backends=backends;
}

function updateAeDesc(backends){
  const sel=$("aemodel"); const id=sel.value;
  const b=(backends||sel._backends||[]).find(x=>x.id===id);
  $("aedesc").textContent=b?(b.available?aeDesc(b):(t("not_installed_prefix")+(b.reason||""))):"";
}

async function onAeChange(){
  const id=$("aemodel").value; updateAeDesc();
  const had=STATE&&STATE.groups&&STATE.groups.length;
  let r,j;
  try{
    r=await fetch("/api/set_aesthetic",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({backend:id})});
    j=await r.json().catch(()=>({}));
  }catch(e){toast(t("network_fail",{e:String(e.message||e)}),true);return;}
  if(!r.ok){toast(t("switch_fail")+(j.detail||r.status),true);return;}
  $("err").textContent="";
  if(had&&j.needs_rescan){
    $("err").textContent=t("rescanning");
    await doScan();
    $("err").textContent="";
  }
}

/* ---- live scan progress ---- */
let PHASE_LABEL={listing:t("ph_listing"),scoring:t("ph_scoring"),grouping:t("ph_grouping"),saving:t("ph_saving"),done:t("ph_done"),error:t("ph_error"),idle:t("ph_idle")};
let progTimer=null, progAuto=false, progSeenRunning=false;

function fmtDur(s){
  s=Math.max(0,Math.round(s));
  return s<60? s+t("sec") : Math.floor(s/60)+t("min")+(s%60)+t("sec");
}

function renderProg(p){
  const box=$("scanprog");
  if(!p||p.phase==="idle"){box.hidden=true;return;}
  box.hidden=false;
  box.classList.toggle("done",p.phase==="done");
  box.classList.toggle("error",p.phase==="error");
  $("spphase").textContent=PHASE_LABEL[p.phase]||p.phase;
  const fill=$("spfill");
  const scoring=p.phase==="scoring"&&p.total>0;
  fill.classList.toggle("indet",!scoring&&p.phase!=="done"&&p.phase!=="error");
  const pctv=scoring?Math.round(p.done/p.total*100):((p.phase==="done"||p.phase==="error")?100:0);
  fill.style.width=pctv+"%";
  $("sppct").textContent=(scoring||p.phase==="done")?pctv+"%":"";
  let count=p.total?t("prog_count",{done:p.done,total:p.total}):"";
  if(p.groups) count+=(count?" · ":"")+t("prog_groups",{n:p.groups});
  $("spcount").textContent=count;
  const elapsed=p.started?Date.now()/1000-p.started:0;
  let eta="";
  if(p.running){
    eta=t("prog_elapsed",{t:fmtDur(elapsed)});
    if(scoring&&p.done>0) eta+=t("prog_eta",{t:fmtDur(elapsed/p.done*(p.total-p.done))});
  }
  $("speta").textContent=eta;
  let file=p.current?t("prog_current",{f:p.current}):"";
  if(p.phase==="scoring"&&p.done===0&&elapsed>6) file=t("prog_loading");
  if(p.phase==="error") file=p.error||t("prog_unknown_err");
  if(p.phase==="done") file=t("prog_summary",{total:p.total,groups:p.groups});
  $("spfile").textContent=file;
  $("spfile").title=p.current||"";
}

async function pollProg(){
  try{
    const r=await fetch("/api/progress");
    if(!r.ok) return;
    const p=await r.json();
    if(p.running) progSeenRunning=true;
    renderProg(p);
    if((progSeenRunning||progAuto)&&!p.running&&(p.phase==="done"||p.phase==="error")){
      stopProgPoll();
      if(progAuto){
        progAuto=false;
        $("scanbtn").textContent=t("scan");$("scanbtn").disabled=false;
        if(p.phase==="done") await loadState();
        else $("err").textContent=t("scan_start_fail")+(p.error||"");
      }
      setTimeout(()=>{const b=$("scanprog");if(b&&!b.classList.contains("error"))b.hidden=true;},1200);
    }
  }catch(e){/* transient hiccup — keep polling */}
}

function startProgPoll(auto){
  progAuto=!!auto; progSeenRunning=false;
  if(progTimer) return;
  pollProg();
  progTimer=setInterval(pollProg,400);
}
function stopProgPoll(){if(progTimer){clearInterval(progTimer);progTimer=null;}}

async function doScan(){
  const folder=$("folder").value.trim();
  if(!folder){toast(t("need_folder"),true);return;}
  $("err").textContent=""; $("scanbtn").textContent=t("scanning"); $("scanbtn").disabled=true;
  renderProg({running:true,phase:"listing",total:0,done:0,current:"",groups:0,started:Date.now()/1000,error:""});
  startProgPoll(false);
  try{
    const r=await fetch("/api/scan",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({folder,recursive:$("recursive").checked})});
    const j=await r.json();
    if(!r.ok){throw new Error(j.detail||t("scan_fail"));}
    await loadState();
    if(j.errors&&j.errors.length){$("err").textContent=t("partial_errors")+j.errors.slice(0,5).join(" | ");}
  }catch(e){$("err").textContent=String(e.message||e);$("scanprog").hidden=true;}
  finally{
    $("scanbtn").textContent=t("scan");$("scanbtn").disabled=false;
    stopProgPoll();
    if(!$("scanprog").hidden){
      try{renderProg(await (await fetch("/api/progress")).json());}catch(e){}
      setTimeout(()=>{const b=$("scanprog");if(!b.classList.contains("error"))b.hidden=true;},1200);
    }
  }
}

async function loadState(){
  STATE=await (await fetch("/api/state")).json();
  render();
}

function render(){
  $("empty").style.display="none";
  const g=$("groups"); g.innerHTML="";
  if(!STATE||!STATE.groups.length){g.innerHTML='<div class="empty">'+t("no_prompt_images")+'</div>';return;}
  const onlyFlagged=$("filterflags")&&$("filterflags").checked;
  let shown=0;
  STATE.groups.forEach((grp,gi)=>{
    const hasFlags=grp.members.some(m=>Object.values(m.scores||{}).some(v=>(v.flags||[]).length));
    if(onlyFlagged&&!hasFlags) return;
    shown++;
    const pos=(grp.positive||t("no_prompt"));
    const el=document.createElement("div"); el.className="group"; el.dataset.gi=gi;
    const chars=grp.character_id?`<span class="tag">${t("char_tag",{id:grp.character_id})}</span>`:"";
    const suspect=grp.suspect?`<span class="tag suspect" title="${escapeHtml(grp.suspect)}">${t("suspect_group")}</span>`:"";
    el.innerHTML=`<div class="ghead">
      <div class="meta">${chars}<span class="tag">${t("n_images",{n:grp.members.length})}</span>
        ${suspect}<span class="mut">${t("group_n",{n:gi+1})}</span></div>
      <div class="pos">${escapeHtml(pos)}</div>
    </div><div class="cards"></div>`;
    const cards=el.querySelector(".cards");
    grp.members.forEach((m,idx)=>{
      const sel=(grp.selected===m.filename);
      const rec=(grp.recommended===m.filename);
      const c=document.createElement("div"); c.className="icard"+(sel?" sel":"");
      const st=(m.scores||{}).structure;
      const subs=Object.entries(m.scores||{}).filter(([k])=>k!=="structure").map(([k,v])=>
        `<span class="sub">${SCORE_LABEL[k]||k} ${pct(v.score)}</span>`).join("");
      // structure line: shadow score + part visibility icons
      let stHtml="";
      if(st){
        const ssub=st.subs||{};
        const vis=ssub.visible||{};
        const icons=[];
        if("person" in vis) icons.push(visIcon(t("vis_person"),vis.person));
        if("hand_l" in vis) icons.push(visIcon(t("vis_hand_l"),vis.hand_l));
        if("hand_r" in vis) icons.push(visIcon(t("vis_hand_r"),vis.hand_r));
        (vis.yolo_parts||[]).forEach(p=>icons.push(visIcon(p,true)));
        const parts=["body","hands","yolo"].filter(k=>ssub[k]!=null)
          .map(k=>`${({body:t("part_body"),hands:t("part_hands"),yolo:t("part_yolo")})[k]}${pct(ssub[k])}`).join(" ");
        const stShadow=(STATE.scorers||[]).find(x=>x.name==="structure")?.shadow;
        stHtml=`<span class="sub st-shadow" title="${stShadow?t("st_shadow_tip"):t("st_active_tip")}">${t("structure")} ${pct(st.score)}${parts?" · "+parts:""} ${icons.join("")}</span>`;
      }
      const flags=[];
      Object.entries(m.scores||{}).forEach(([k,v])=>(v.flags||[]).forEach(f=>flags.push(k==="structure"?f:`[${SCORE_LABEL[k]||k}] ${f}`)));
      if(m.outfit && m.outfit_ratio<0.6) flags.push(t("outfit_low_flag",{pct:pct(m.outfit_ratio)}));
      const flagHtml=flags.map(f=>`<span class="flag">${escapeHtml(f)}</span>`).join("");
      const out=m.outfit?`<span class="sub">${t("outfit",{name:escapeHtml(m.outfit),pct:pct(m.outfit_ratio)})}</span>`:"";
      c.innerHTML=`${rec?`<span class="rec">${t("recommended")}</span>`:''}
        <span class="badge">${pct(m.composite)}</span>
        <img loading="lazy" src="/api/thumb?size=512&path=${encodeURIComponent(m.path)}"
             onclick="event.stopPropagation();showFull(${gi},${idx})"/>
        <div class="ibody">
          <div class="fname">${escapeHtml(m.filename)}</div>
          <div class="bar"><i style="width:${Math.round(m.composite*100)}%"></i></div>
          <div class="subs">${subs}${out}${stHtml}</div>
          <div class="flags">${flagHtml}</div>
        </div>`;
      c.onclick=()=>selectImg(grp.key,m.filename,c);
      cards.appendChild(c);
    });
    // 空白卡片：选中后该组不选任何图
    const isBlank=(grp.selected===null);
    const blank=document.createElement("div");
    blank.className="icard blank"+(isBlank?" sel":"");
    blank.innerHTML=`<span class="blank-icon">⊘</span><span class="blank-text">${t("select_none")}</span>`;
    blank.onclick=()=>selectImg(grp.key,null,blank);
    cards.appendChild(blank);
    g.appendChild(el);
  });
  if(onlyFlagged&&!shown){g.innerHTML='<div class="empty">'+t("no_flagged_groups")+'</div>';}
}

function visIcon(label,on){
  return `<span class="vis ${on?'y':'n'}" title="${escapeHtml(label)}:${on?t("visible"):t("not_detected")}">${escapeHtml(label)}${on?'✓':'—'}</span>`;
}

async function selectImg(key,filename,cardEl){
  await fetch("/api/select",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({key,filename})});
  cardEl.parentElement.querySelectorAll(".icard").forEach(x=>x.classList.remove("sel"));
  cardEl.classList.add("sel");
  // sync STATE so blank card / lightbox stay consistent
  if(STATE){
    const grp=STATE.groups.find(g=>g.key===key);
    if(grp) grp.selected=filename;
  }
}

/* ---- Lightbox with group navigation ---- */
let LB={gi:-1,idx:-1};

function showFull(gi,idx){
  LB={gi,idx};
  _lbRender();
  $("lb").classList.add("on");
}

function _lbRender(){
  if(!STATE||LB.gi<0) return;
  const grp=STATE.groups[LB.gi];
  if(!grp||!grp.members.length) return;
  const m=grp.members[LB.idx];
  $("lbimg").src="/api/image?path="+encodeURIComponent(m.path);
  const st=(m.scores||{}).structure;
  const stTxt=st?t("lb_structure",{pct:pct(st.score)})+(st.flags&&st.flags.length?" · "+st.flags.slice(0,3).join("/"):""):"";
  $("lbcap").textContent=t("lb_composite",{file:m.filename,pct:pct(m.composite),st:stTxt});
  $("lbcounter").textContent=t("lb_counter",{gi:LB.gi+1,gtotal:STATE.groups.length,mi:LB.idx+1,mtotal:grp.members.length});
  // overlay toggle only when structure data exists (scorer ran)
  $("lbov").style.display=st?"":"none";
  $("lbov").classList.remove("on");
  LB.overlayOn=false;
}

function lbToggleOverlay(){
  if(!STATE||LB.gi<0) return;
  const m=STATE.groups[LB.gi].members[LB.idx];
  LB.overlayOn=!LB.overlayOn;
  $("lbov").classList.toggle("on",LB.overlayOn);
  $("lbimg").src=(LB.overlayOn?"/api/overlay?path=":"/api/image?path=")+encodeURIComponent(m.path);
}

function lbNav(dir){
  if(!STATE||LB.gi<0) return;
  const grp=STATE.groups[LB.gi];
  if(!grp) return;
  const n=grp.members.length;
  LB.idx=((LB.idx+dir)%n+n)%n;
  _lbRender();
}

function lbNavGroup(dir){
  if(!STATE||LB.gi<0) return;
  const total=STATE.groups.length;
  LB.gi=((LB.gi+dir)%total+total)%total;
  LB.idx=0;
  _lbRender();
}

function lbSelect(){
  if(!STATE||LB.gi<0) return;
  const grp=STATE.groups[LB.gi];
  if(!grp) return;
  const m=grp.members[LB.idx];
  // find the card by group index stored in data-gi (filter mode shifts DOM order)
  const el=document.querySelector(`.group[data-gi="${LB.gi}"]`);
  const cards=el?el.querySelectorAll(".icard:not(.blank)"):null;
  if(cards&&cards[LB.idx]) selectImg(grp.key,m.filename,cards[LB.idx]);
}

function lbBackdropClick(e){
  if(e.target===$("lb")) $("lb").classList.remove("on");
}

/* Keyboard: arrows + Enter while lightbox is open */
document.addEventListener("keydown",e=>{
  if(!$("lb").classList.contains("on")) return;
  if(e.key==="ArrowLeft"){lbNav(-1);e.preventDefault();}
  else if(e.key==="ArrowRight"){lbNav(1);e.preventDefault();}
  else if(e.key==="ArrowUp"){lbNavGroup(-1);e.preventDefault();}
  else if(e.key==="ArrowDown"){lbNavGroup(1);e.preventDefault();}
  else if(e.key==="Enter"){lbSelect();e.preventDefault();}
  else if(e.key==="o"||e.key==="O"){lbToggleOverlay();e.preventDefault();}
  else if(e.key==="Escape"){ $("lb").classList.remove("on");e.preventDefault();}
});

async function exportJSON(){
  const record=$("record")&&$("record").checked;
  let r,j;
  try{
    r=await fetch("/api/export",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({mode:"json",record})});
    j=await r.json().catch(()=>null);
  }catch(e){toast(t("network_fail",{e:String(e.message||e)}),true);return;}
  if(!r.ok||!j){toast(t("export_fail")+((j&&j.detail)||("HTTP "+r.status)),true);return;}
  const blob=new Blob([JSON.stringify(j.selected,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="curator-selected.json";a.click();
  if(record&&j.feedback) toast(t("feedback_saved",{path:j.feedback}).trim());
}
async function exportCopy(){
  const dest=$("dest").value.trim();
  if(!dest){toast(t("need_dest"),true);return;}
  const record=$("record")&&$("record").checked;
  let r,j;
  try{
    r=await fetch("/api/export",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({mode:"copy",dest,record})});
    j=await r.json().catch(()=>null);
  }catch(e){toast(t("network_fail",{e:String(e.message||e)}),true);return;}
  if(!r.ok||!j){toast(t("copy_fail")+" — "+((j&&j.detail)||("HTTP "+r.status)),true);return;}
  let msg=t("copied_ok",{n:j.copied.length,dest});
  if(record&&j.feedback) msg+=t("feedback_saved",{path:j.feedback});
  toast(msg);
}

const pct=x=>(x==null?"-":Math.round(x*100));
function escapeHtml(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function escapeAttr(s){return (s||"").replace(/'/g,"\\'");}

applyLang();
loadStatus().then(()=>fetch("/api/state").then(r=>r.json()).then(s=>{
  if(s&&s.root){$("folder").value=s.root;}
  if(s&&s.groups&&s.groups.length){STATE=s;render();}
  // --folder auto-scan (or a scan started in another tab) already running?
  const p=s&&s.progress;
  if(p&&p.running){
    $("scanbtn").textContent=t("scanning");$("scanbtn").disabled=true;
    renderProg(p);startProgPoll(true);
  }
}));
</script>
