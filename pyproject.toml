[project]
name = "anime-image-curator"
version = "0.1.0"
description = "Local anime-image QA + per-prompt best-pick curator with a WebUI. No cloud."
readme = "README.md"
requires-python = ">=3.10"
# 基础依赖：WebUI + 元数据解析 + 分组 + 轻量质检。装完即可启动（秒开，无大模型下载）。
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pillow",
    "pyyaml",
    "numpy",
]

[project.optional-dependencies]
# 美观度打分。可切换多个模型（见 config/curator.yaml 的 aesthetic_model，或 WebUI 下拉框）。
# 首次使用某个模型时按需下载。作为"结构合理性 + 选优"的参考分。
# torch 默认装 PyPI 版；有 NVIDIA 卡想要 GPU 加速用 run.bat --gpu（会改装 CUDA 版 torch）。
aesthetic = [
    "torch",
    "open-clip-torch",            # improved-clip backend
    "transformers",               # shadow-v2 backend (ViTForImageClassification)
    "aesthetic-predictor-v2-5",   # aesthetic-predictor-v2-5 backend (SigLIP)
    "onnxruntime-directml; sys_platform == 'win32'",  # skytnt-anime backend (ONNX)
    "onnxruntime; sys_platform != 'win32'",
    "huggingface_hub",            # model downloads
]
# 结构打分：DWPose 骨架/手部几何 + 检测器 A/B + 脚趾规则。仅靠 onnxruntime，不引入 torch。
# Windows 用 DirectML 版（GPU），其他平台 CPU 版；两者互斥，避免同目录双发行版冲突。
# 模型（~340MB）首次使用时自动从 hf-mirror 下载，或 scripts/setup_models.py 预下载。
structure = [
    "onnxruntime-directml; sys_platform == 'win32'",
    "onnxruntime; sys_platform != 'win32'",
    "huggingface_hub",
]
# YOLO 部位检测板块（可选，仅当 curator.yaml 里配置了 structure.yolo.models 时需要）。
# 默认 .onnx 模型走 DirectML，无需本 extra；仅 .pt 模型回退 ultralytics（依赖 torch）。
yolo = [
    "ultralytics",
]
# 本地 VLM 结构/手部判定：便携 llama-server（llama.cpp）+ GGUF，零 Python 额外依赖。
# 权重/二进制由 scripts/setup_models.py --only vlm 下载到 .models/，curator 按需自动启停。
# 不装 Ollama、不引入 torch；既有 OpenAI 兼容端点可经 vlm_judge.base_url 复用。
vlm = []

[dependency-groups]
dev = ["pytest"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
